plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.+'
}

version = '1.0.0'
group = 'com.netmusicdisplay'

// Forge 1.20.1 使用 Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// ===== 依赖仓库 =====
// 国内镜像优先，加速下载；Create / Flywheel / Registrate 分散在以下 maven 仓库
repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }       // 阿里云公共镜像
    maven { url = 'https://modmaven.dev/' }                            // Create, Flywheel
    maven { url = 'https://maven.tterrag.com/' }                       // Registrate, Flywheel
    maven { url = 'https://maven.blamejared.com' }                     // JEI（传递依赖）
    maven { url = 'https://maven.theillusivec4.top/' }                 // Curios（传递依赖）
    maven { url = 'https://cursemaven.com' }
    mavenCentral()
}

minecraft {
    // 使用官方映射
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                netmusicdisplay {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                netmusicdisplay {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'

    // ===== 机械动力 Create 及其前置 =====
    // Create 0.5.1.f slim jar（不含传递依赖）+ 手动声明 Flywheel / Registrate
    // maven 坐标依据 modmaven.dev 上的 create-1.20.1:0.5.1.f-26
    implementation fg.deobf("com.simibubi.create:create-1.20.1:0.5.1.f-26:slim") { transitive = false }
    implementation fg.deobf("com.jozufozu.flywheel:flywheel-forge-1.20.1:0.6.10-7")
    implementation fg.deobf("com.tterrag.registrate:Registrate:MC1.20-1.3.3")

    // ===== 网络音乐机 Net Music =====
    // jar 已放进 libs/ 文件夹（从 Modrinth 下载的 1.20.1 Forge 版）
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
