logoFile="assets/netmusicdisplay/icon.png"

[[mods]]
modId="netmusicdisplay"
version="1.0.0"
displayName="Net Music Display | 不是显示来源"
authors="枕燕眠"
description='''
让机械动力(Create)的显示链接器能读取网络音乐机(Net Music)里唱片的歌曲名、
播放状态和歌词，并显示在翻牌显示器/霓虹灯管/牌子上。

Let Create's Display Link read the song name, play status and lyrics
from a Net Music CD player and show it on the Display Board / Nixie Tube / Sign.
'''

# ===== 依赖：Forge =====
[[dependencies.netmusicdisplay]]
    modId="forge"
    mandatory=true
    type="required"
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

# ===== 依赖：Minecraft 1.20.1 =====
[[dependencies.netmusicdisplay]]
    modId="minecraft"
    mandatory=true
    type="required"
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"

# ===== 依赖：机械动力 Create =====
[[dependencies.netmusicdisplay]]
    modId="create"
    mandatory=true
    type="required"
    versionRange="[0.5.1,0.6)"
    ordering="AFTER"
    side="BOTH"

# ===== 依赖：网络音乐机 Net Music =====
[[dependencies.netmusicdisplay]]
    modId="netmusic"
    mandatory=true
    type="required"
    versionRange="[1.0,)"
    ordering="AFTER"
    side="BOTH"
